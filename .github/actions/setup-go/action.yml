name: Setup Go
description: Checkout the repo and set up Go with module/build caching.
inputs:
  go-version:
    description: Go version to install
    required: false
    default: "1.25"
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache: true
