name: CI

on:
  push:
    branches: [live]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Build
        run: go build ./cmd/... ./internal/...

      - name: Test
        run: go test -race ./internal/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.13.2
          args: ./cmd/... ./internal/...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: gui/frontend

      - name: Typecheck + build
        run: npx tsc --noEmit && npx vite build --mode production
        working-directory: gui/frontend
