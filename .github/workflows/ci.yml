name: CI

on:
  push:
    branches: [live]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Build
        run: go build ./cmd/... ./internal/...

      - name: Test
        run: go test -race ./internal/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: ./cmd/... ./internal/...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      # bindings are generated (not committed), so produce them before the build.
      # Wails' Go package needs GTK4/WebKit to compile (even for binding generation).
      - name: Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16

      - name: Generate bindings
        run: wails3 generate bindings -ts -clean=true
        working-directory: gui

      - name: Install
        run: npm ci
        working-directory: gui/frontend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: gui/frontend

      - name: Build (creates dist/ for the Go embed)
        run: npx vite build --mode production
        working-directory: gui/frontend
