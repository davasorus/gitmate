name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

# Run CI on every push and every PR, but avoid double runs when a push lands on a
# branch that already has an open PR: both events share the same head branch, so
# grouping by it (and cancelling in-progress) collapses the duplicate into one run.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

env:
  COVERAGE_MIN: "85" # minimum total coverage %; CI fails below this. Bump toward higher over time.

jobs:
  # Gate: on a push to a branch that already has an open PR, skip the push run —
  # the pull_request run covers that branch. PR events always proceed.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Decide whether this run should proceed
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # push event: is there an open PR whose head is this branch?
          prs=$(gh pr list --repo "${{ github.repository }}" --head "${{ github.ref_name }}" --state open --json number --jq 'length')
          if [ "$prs" -gt 0 ]; then
            echo "push on a branch with an open PR → skipping (PR CI covers it)"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  # Detect which areas changed so we can skip jobs that aren't affected.
  changes:
    needs: gate
    if: ${{ needs.gate.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'
            frontend:
              - 'gui/frontend/**'
              - 'gui/**/*.go'
              - '.github/workflows/ci.yml'

  go:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go

      - name: gofmt (fail if unformatted)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run: gofmt -w cmd internal"
            exit 1
          fi

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Build
        run: go build ./cmd/... ./internal/...

      # Race detection (all OSes): catches data races. Separate from coverage —
      # -race alters branch execution and skews the coverage %, so it must not
      # drive the coverage gate.
      - name: Test (race)
        run: go test -race ./internal/...

      # Coverage (Linux only): measured WITHOUT -race so the number is stable and
      # reproducible locally (plain `go test`), then gated against COVERAGE_MIN.
      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go test -coverprofile=coverage.out -covermode=count ./internal/...
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "----- total coverage: ${total}% (min ${COVERAGE_MIN}%) -----"
          # capture the number for the sync job's PR report (before the gate, so it's
          # recorded regardless of pass/fail)
          echo "$total" > coverage-total.txt
          if awk "BEGIN{exit !($total < $COVERAGE_MIN)}"; then
            echo "::error::coverage ${total}% is below the required ${COVERAGE_MIN}%"
            exit 1
          fi

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage-total.txt

      - name: golangci-lint
        if: matrix.os == 'ubuntu-latest' # lint is OS-agnostic; run once
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: ./cmd/... ./internal/...

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      # Cache the compiled wails3 binary so it isn't rebuilt from source every run.
      - name: Cache wails3
        id: cache-wails
        uses: actions/cache@v6
        with:
          path: ~/go/bin/wails3
          key: wails3-${{ runner.os }}-v3.0.0-beta.16

      # bindings are generated (not committed), so produce them before the build.
      # Wails' Go package needs GTK4/WebKit to compile (even for binding generation).
      - name: Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails v3
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16

      - name: Generate bindings
        run: wails3 generate bindings -ts -clean=true
        working-directory: gui

      - name: Install
        run: npm ci
        working-directory: gui/frontend

      - name: Lint (oxlint)
        run: npm run lint
        working-directory: gui/frontend

      - name: Format check (Prettier)
        run: npm run format:check
        working-directory: gui/frontend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: gui/frontend

      - name: Build (creates dist/ for the Go embed)
        run: npx vite build --mode production
        working-directory: gui/frontend

      # Lint the Go GUI package HERE (not in the go job): gui/main.go embeds
      # frontend/dist via //go:embed, which only exists after the vite build above.
      # Linting it here means the embed resolves naturally — no placeholder tricks.
      - name: golangci-lint (gui)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: ./gui/...

  # ---- SYNC: aggregate status + report to the PR --------------------------
  # One required check: passes only if go and frontend both succeeded (a skipped
  # job — because its paths didn't change — counts as not-failing). Also posts a
  # self-updating summary comment on the PR with per-job status + coverage.
  sync:
    needs: [changes, go, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage
        if: needs.go.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: cov
        continue-on-error: true

      - name: Report tests + coverage to PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            // a job that was skipped (paths unchanged) is not a failure
            const bad = (v) => v === 'failure' || v === 'cancelled';
            const anyFailed = bad('${{ needs.go.result }}') || bad('${{ needs.frontend.result }}');

            // --- the PR comment reports TEST + COVERAGE results (go test suite) ---
            const testsRan = '${{ needs.go.result }}' !== 'skipped';
            const testsOk = '${{ needs.go.result }}' === 'success';
            let cov = null;
            try { cov = fs.readFileSync('cov/coverage-total.txt', 'utf8').trim(); } catch (e) {}
            const min = '${{ env.COVERAGE_MIN }}';

            let line;
            if (!testsRan) {
              line = `⏭️ **Tests skipped** — no Go changes`;
            } else if (testsOk) {
              line = `✅ **Tests passed**${cov ? ` — coverage ${cov}%` : ''}`;
            } else {
              line = `❌ **Tests failed**${cov ? ` — coverage ${cov}% (min ${min}%)` : ''}`;
            }
            const body = `<!-- gitmate-ci -->\n${line}`;

            if (context.payload.pull_request) {
              const { owner, repo } = context.repo;
              const prNum = context.payload.pull_request.number;
              const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: prNum });
              const mine = comments.find(c => c.body && c.body.includes('<!-- gitmate-ci -->'));
              if (mine) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNum, body });
              }
            }

            // required-check semantics: the sync job itself fails if any CI job failed
            if (anyFailed) core.setFailed('one or more CI jobs failed');
