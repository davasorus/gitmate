name: CI

on:
  push:
    branches: [live]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: true

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Test
        run: go test -race ./internal/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: ./cmd/... ./internal/...