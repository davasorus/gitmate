name: CI

on:
  push:
    branches: [live]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Build
        run: go build ./cmd/... ./internal/...

      - name: Test
        run: go test -race ./internal/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: ./cmd/... ./internal/...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: gui/frontend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: gui/frontend

      - name: Build (creates dist/ for the Go embed)
        run: npx vite build --mode production
        working-directory: gui/frontend

  gui-go:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      # gui/main.go embeds frontend/dist, so the frontend must be built first
      # (dist/ is gitignored, so it isn't in the checkout — build it here).
      - name: Build frontend (for embed)
        run: npm ci && npx vite build --mode production
        working-directory: gui/frontend

      - name: Vet + build gui package
        run: go vet ./gui/... && go build ./gui/...
