name: Release

# ONE pipeline, gated. Nothing is created (no tag, no release, no binaries) until
# a human reviews the proposed version + notes and APPROVES.
#
# Flow:  propose (compute version + notes, show them, create NOTHING)
#        → gate (environment: release — you read the notes, approve/deny)
#        → build (CLI + GUI) → publish (ONE immutable release)  [only after approval]
on:
  push:
    branches: [live]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---- PROPOSE: compute version + notes, display them, create nothing ----
  propose:
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # semantic-release in DRY-RUN. This action exposes the computed version and
      # the full rendered release notes as OUTPUTS (reliable — no file writing).
      - name: Compute version + notes (dry run, creates nothing)
        id: semrel
        uses: cycjimmy/semantic-release-action@v6
        with:
          dry_run: true
          semantic_version: 25
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            conventional-changelog-conventionalcommits@9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Write the PROPOSAL as markdown to the run summary — THIS is what you review.
      - name: Show release proposal
        if: steps.semrel.outputs.new_release_published == 'true'
        run: |
          {
            echo "# 🚀 Release proposal"
            echo ""
            echo "**Proposed version:** \`v${{ steps.semrel.outputs.new_release_version }}\`"
            echo ""
            echo "## Release notes (what will be published)"
            echo ""
            cat <<'NOTES'
          ${{ steps.semrel.outputs.new_release_notes }}
          NOTES
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing to release
        if: steps.semrel.outputs.new_release_published != 'true'
        run: echo "No release-worthy commits since the last tag — nothing to propose." >> "$GITHUB_STEP_SUMMARY"

      # Persist version + notes for the later stages (after approval).
      - name: Save proposal
        if: steps.semrel.outputs.new_release_published == 'true'
        run: |
          echo "${{ steps.semrel.outputs.new_release_version }}" > release-version.txt
          cat <<'NOTES' > release-notes.md
          ${{ steps.semrel.outputs.new_release_notes }}
          NOTES
      - name: Upload proposal
        if: steps.semrel.outputs.new_release_published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: |
            release-version.txt
            release-notes.md
          if-no-files-found: error

  # ---- GATE: you review the proposal above, then approve. Nothing built yet. ----
  gate:
    needs: propose
    if: needs.propose.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    environment: release # required reviewer here → pauses for your approval
    steps:
      - run: echo "Approved. Proceeding to build + publish v${{ needs.propose.outputs.version }}."

  # ---- BUILD (only after approval) ----
  build-cli:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-go
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --clean --snapshot
      - uses: actions/upload-artifact@v4
        with:
          name: cli-artifacts
          path: dist/**/gitmate*
          if-no-files-found: warn

  build-gui:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/wails-setup
      - name: Frontend deps
        run: npm ci
        working-directory: gui/frontend
      - name: Build GUI
        run: wails3 build
        working-directory: gui
      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.os }}
          path: gui/bin/*
          if-no-files-found: warn

  # ---- PUBLISH: ONE immutable release, tag + notes + all assets, at once ----
  publish:
    needs: [propose, build-cli, build-gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }} # tag push bypasses v* ruleset
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Assemble assets
        run: |
          mkdir -p out
          find artifacts -type f \( -name 'gitmate*' -o -name '*.exe' \) -exec cp {} out/ \; || true
          ls -la out || true
      - name: Create the single immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="v$(cat artifacts/release-meta/release-version.txt)"
          git tag "$VER"
          git push origin "$VER"
          gh release create "$VER" \
            --title "$VER" \
            --notes-file artifacts/release-meta/release-notes.md \
            out/* || gh release create "$VER" --title "$VER" --notes-file artifacts/release-meta/release-notes.md
