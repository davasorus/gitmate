name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: write # required so the workflow can create the GitHub Release

jobs:
    # CLI release via GoReleaser (linux/windows/darwin, amd64/arm64) + checksums.
    cli:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # GoReleaser needs full history for the changelog
            - uses: actions/setup-go@v7
              with:
                  go-version: "1.25"
            - uses: goreleaser/goreleaser-action@v6
              with:
                  version: "~> v2"
                  args: release --clean
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # GUI desktop app per-OS via Wails, attached to the same release.
    gui:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      artifact: gitmate-gui-windows-amd64.exe
                    - os: macos-latest
                      artifact: gitmate-gui-darwin
                    - os: ubuntu-latest
                      artifact: gitmate-gui-linux-amd64
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v7
              with:
                  go-version: "1.25"
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
            # Linux needs GTK/WebKit for the Wails webview build.
            - name: Linux deps
              if: matrix.os == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
            - name: Install Wails v3
              run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
            - name: Frontend deps
              run: npm ci
              working-directory: gui/frontend
            - name: Build GUI
              run: wails3 build
              working-directory: gui
            # attach the built binary to the release (path differs per OS under gui/bin)
            - name: Upload GUI asset
              uses: softprops/action-gh-release@v2
              with:
                  files: gui/bin/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
