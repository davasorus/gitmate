name: Release

# ONE pipeline, gated. Nothing is created (no tag, no release, no binaries) until
# a human reviews the proposed version + notes and APPROVES.
#
# Flow:  propose (compute version + notes, show them, create NOTHING)
#        → gate (environment: release — you read the notes, approve/deny)
#        → build (CLI + GUI) → publish (ONE immutable release)  [only after approval]
on:
  push:
    branches: [live]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---- PROPOSE: compute version + notes, display them, create nothing ----
  propose:
    runs-on: ubuntu-latest
    outputs:
      # true when there's something to release (either path)
      release: ${{ steps.collect.outputs.release }}
      version: ${{ steps.collect.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ---- LIVE path: semantic-release DECIDES the version + notes (dry run) ----
      - name: Compute version + notes (dry run, creates nothing)
        id: semrel
        if: github.ref == 'refs/heads/live'
        uses: cycjimmy/semantic-release-action@v6
        with:
          dry_run: true
          semantic_version: 25
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            conventional-changelog-conventionalcommits@9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save proposal (live path)
        if: github.ref == 'refs/heads/live' && steps.semrel.outputs.new_release_published == 'true'
        run: |
          echo "${{ steps.semrel.outputs.new_release_version }}" > release-version.txt
          cat <<'NOTES' > release-notes.md
          ${{ steps.semrel.outputs.new_release_notes }}
          NOTES

      # ---- TAG path: version IS the tag; generate grouped notes for its range ----
      - name: Compute notes from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "$VER" > release-version.txt
          npm install -g conventional-changelog-cli conventional-changelog-conventionalcommits@9
          # grouped notes for just the latest tag's commit range
          conventional-changelog -p conventionalcommits -r 2 --skip-unstable > release-notes.md || true
          if [ ! -s release-notes.md ]; then echo "Release ${GITHUB_REF_NAME}" > release-notes.md; fi

      # ---- collect: unify both paths into outputs + the reviewable proposal ----
      - name: Collect + show proposal
        id: collect
        run: |
          if [ -f release-version.txt ]; then
            VER="$(cat release-version.txt)"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            {
              echo "# 🚀 Release proposal"
              echo ""
              echo "**Proposed version:** \`v${VER}\`"
              echo ""
              echo "## Release notes (what will be published)"
              echo ""
              cat release-notes.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No release-worthy commits since the last tag — nothing to propose." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload proposal
        if: steps.collect.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-meta
          path: |
            release-version.txt
            release-notes.md
          if-no-files-found: error

  # ---- GATE: you review the proposal above, then approve. Nothing built yet. ----
  gate:
    needs: propose
    if: needs.propose.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release # required reviewer here → pauses for your approval
    steps:
      - run: echo "Approved. Proceeding to build + publish v${{ needs.propose.outputs.version }}."

  # ---- BUILD (only after approval) ----
  build-cli:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-go
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --snapshot --skip=publish
      # archives are uniquely named per platform (…_linux_amd64.tar.gz etc.)
      - uses: actions/upload-artifact@v7
        with:
          name: cli-artifacts
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*checksums*
          if-no-files-found: warn

  build-gui:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Linux GUI deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
      - name: Frontend deps
        run: npm ci
        working-directory: gui/frontend
      - name: Build GUI
        run: wails3 build
        working-directory: gui
      - uses: actions/upload-artifact@v7
        with:
          name: gui-${{ matrix.os }}
          path: gui/bin/*
          if-no-files-found: warn

  # ---- PUBLISH: ONE immutable release, tag + notes + all assets, at once ----
  publish:
    needs: [propose, build-cli, build-gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@v8
        with: { path: artifacts }
      - name: Assemble assets
        run: |
          mkdir -p out
          # CLI archives: already uniquely named per platform — copy straight in.
          find artifacts/cli-artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*checksums*' \) -exec cp {} out/ \; || true
          # GUI: one binary per OS, same base name → rename per-OS to avoid collisions.
          for d in artifacts/gui-*; do
            [ -d "$d" ] || continue
            osname="$(basename "$d" | sed 's/^gui-//')"       # e.g. ubuntu-latest
            f="$(find "$d" -type f | head -1)"
            [ -n "$f" ] || continue
            ext="${f##*.}"
            case "$f" in
              *.exe) cp "$f" "out/gitmate-gui-${osname}.exe" ;;
              *)     cp "$f" "out/gitmate-gui-${osname}" ;;
            esac
          done
          ls -la out || true
      - name: Create the single immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="v$(cat artifacts/release-meta/release-version.txt)"
          git tag "$VER"
          git push origin "$VER"
          gh release create "$VER" \
            --title "$VER" \
            --notes-file artifacts/release-meta/release-notes.md \
            out/* || gh release create "$VER" --title "$VER" --notes-file artifacts/release-meta/release-notes.md
