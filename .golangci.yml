version: "2"

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - revive
  settings:
    revive:
      rules:
        # require doc comments on exported symbols (keeps godoc coverage from rotting)
        - name: exported
          arguments:
            - checkPrivateReceivers
            - disableStutteringCheck # allow "Client" methods etc. without name-stutter nags
