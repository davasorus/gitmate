version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: gitmate
    main: ./cmd/gitmate
    binary: gitmate
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/davasorus/gitmate/internal/version.Stamped={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  use: github
  sort: asc
